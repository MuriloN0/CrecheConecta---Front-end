<div class="titulo">
  <div>
    <h1>Editar Observacao</h1>
    <p>Altere os dados da observacao sobre o aluno.</p>
  </div>
</div>
<section class="cartao">
  @if (carregando()) {
    <p class="mensagem">Carregando...</p>
  }
  @if (erro()) {
    <p class="mensagem erro">{{ erro() }}</p>
  }
  <div class="campo">
    <label>Titulo
      <input
        type="text"
        [value]="titulo()"
        (input)="atualizarTitulo($any($event.target).value)"
      />
    </label>
  </div>
  <div class="campo">
    <label>Conteudo
      <textarea
        rows="6"
        [value]="conteudo()"
        (input)="atualizarConteudo($any($event.target).value)"
      ></textarea>
    </label>
  </div>
  <div class="rodape-form">
    <button class="cancelar" type="button" (click)="cancelar()">Cancelar</button>
    <button class="principal" type="button" (click)="salvar()" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</section>
