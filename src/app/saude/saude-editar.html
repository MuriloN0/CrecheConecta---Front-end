<div class="pagina">
  <header class="cabecalho">
    <div>
      <h1>Editar Ficha de Saúde</h1>
      <p class="subtitulo">Altere os dados da ficha de saúde.</p>
    </div>
  </header>

  <section class="cartao">
    @if (carregando()) {
      <p class="aviso">Carregando...</p>
    }

    @if (erro()) {
      <p class="aviso erro">{{ erro() }}</p>
    }

    @if (!carregando()) {
      <div class="campo">
        <label>Nome da Ficha</label>
        <input
          type="text"
          [value]="nome()"
          (input)="atualizarNome($any($event.target).value)"
        />
      </div>

      <div class="campo">
        <label>Observações da ficha</label>
        <textarea
          rows="6"
          [value]="observacoes()"
          (input)="atualizarObservacoes($any($event.target).value)"
        ></textarea>
      </div>

      <div class="form-acoes">
        <button class="btn-nao" type="button" (click)="cancelar()">Cancelar</button>
        <button class="btn-primario" type="button" (click)="salvar()" [disabled]="salvando()">
          {{ salvando() ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    }
  </section>
</div>
