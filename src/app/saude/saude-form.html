<div class="titulo">
  <div>
    <h1>Cadastrar Informação Relevante</h1>
    <p>Preencha os dados da informação relevante do aluno.</p>
  </div>
</div>
<section class="cartao">
  @if (erro()) {
    <p class="mensagem erro">{{ erro() }}</p>
  }
  <div class="campo">
    <label>Nome
      <input
        type="text"
        [value]="nome()"
        (input)="atualizarNome($any($event.target).value)"
        placeholder="Ex.: Alergia a Amendoim"
      />
    </label>
  </div>
  <div class="campo">
    <label>Observações
      <textarea
        rows="6"
        [value]="observacoes()"
        (input)="atualizarObservacoes($any($event.target).value)"
        placeholder="Descreva as observações relevantes..."
      ></textarea>
    </label>
  </div>
  <div class="rodape-form">
    <button class="cancelar" type="button" (click)="cancelar()">Cancelar</button>
    <button class="principal" type="button" (click)="salvar()" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</section>
