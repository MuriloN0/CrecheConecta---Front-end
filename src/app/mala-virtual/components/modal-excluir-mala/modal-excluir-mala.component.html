<dialog
  appDialogoModal
  role="alertdialog"
  class="m-auto max-h-[calc(100dvh_-_1.5rem)] w-[calc(100%_-_1.5rem)] max-w-lg rounded-2xl
         border border-stone-200 bg-white p-0 text-creche-texto shadow-xl
         backdrop:bg-creche-texto/45"
  aria-labelledby="titulo-excluir-mala"
  aria-describedby="descricao-excluir-mala"
  [bloqueado]="excluindo()"
  (fecharDialogo)="cancelar.emit()"
>
  <div class="space-y-4 p-4 sm:p-6">
    <h2 id="titulo-excluir-mala" class="text-lg font-bold text-creche-texto">
      Excluir mala
    </h2>

    <p id="descricao-excluir-mala" class="wrap-break-word">
      Deseja excluir “{{ mala().titulo }}”, da aula de
      {{ mala().data | date: 'dd/MM/yyyy' : 'UTC' }}?
      A lista e todas as marcações feitas pelas famílias serão apagadas.
    </p>

    @if (erro()) {
      <p
        role="alert"
        class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800"
      >
        {{ erro() }}
      </p>
    }

    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="min-h-11 cursor-pointer rounded-xl border border-stone-300 bg-white px-4 py-2.5 text-sm font-semibold text-creche-verde enabled:hover:bg-stone-50 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-creche-verde disabled:cursor-not-allowed disabled:opacity-60"
        autofocus
        [disabled]="excluindo()"
        (click)="cancelar.emit()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="min-h-11 cursor-pointer rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-800 enabled:hover:bg-red-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-creche-verde disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="excluindo()"
        (click)="confirmar.emit()"
      >
        {{ excluindo() ? 'Excluindo…' : 'Confirmar exclusão' }}
      </button>
    </div>
  </div>
</dialog>
