# CI do front-end: instala as dependências exatas do package-lock e gera o build de produção
# (o mesmo que a Vercel executa). Não precisa do back-end nem de segredos.
name: CI Front-end

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Só leitura do repositório: o workflow não publica nada.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: ci-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Node 22 (com cache do npm)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências (package-lock)
        run: npm ci

      - name: Build de produção
        run: npm run build
